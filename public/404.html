<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#000" />
    <title>404: NOT_FOUND</title>
    <style>
      html {
        font-size: 62.5%;
        box-sizing: border-box;
        height: -webkit-fill-available;
      }

      *,::after,::before {
        box-sizing: inherit;
      }

      body {
        font-family: sf pro text,sf pro icons,helvetica neue,helvetica,arial,sans-serif;
        font-size: 1.6rem;
        line-height: 1.65;
        word-break: break-word;
        font-kerning: auto;
        font-variant: normal;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        hyphens: auto;
        height: 100vh;
        height: -webkit-fill-available;
        max-height: 100vh;
        max-height: -webkit-fill-available;
        margin: 0;
      }

      ::selection {
        background: #79ffe1;
      }

      a {
        cursor: pointer;
        color: #0070f3;
        text-decoration: none;
        transition: all .2s ease;
        border-bottom: 1px solid #0000;
      }

      a:hover {
        border-bottom: 1px solid #0070f3;
      }

      .container {
        display: flex;
        justify-content: center;
        flex-direction: column;
        min-height: 100%;
      }

      main {
        max-width: 80rem;
        padding: 4rem 6rem;
        margin: auto;
      }

      .devinfo-container {
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        margin-bottom: 32px;
      }

      .error-code {
        margin: 0;
        font-size: 1.6rem;
        color: #000;
        margin-bottom: 1.6rem;
      }

      .note {
        padding: 8pt 16pt;
        border-radius: 5px;
        border: 1px solid #0070f3;
        font-size: 14px;
        line-height: 1.8;
        color: #0070f3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <main>
        <p class="devinfo-container">
          <span class="error-code">
            <strong>404</strong>
            : NOT_FOUND
          </span>
          <span class="devinfo-line">Code: <code>NOT_FOUND</code></span>
          <span class="devinfo-line">ID: <code>cpt1::th94g-1786832884048-0eb157a4a7e0</code></span>
        </p>

        <a href="https://vercel.com/docs/errors/NOT_FOUND" class="owner-error">
          <div class="note">Read our documentation to learn more about this error.</div>
        </a>
      </main>
    </div>
  </body>
</html>
